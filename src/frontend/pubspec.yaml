name: preventivi_app
description: Preventivi App — presupuestos y mediciones de obra (Flutter, offline-first).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Dependencias previstas (se fijarán versiones al inicializar el proyecto).
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0     # Gestión de estado (MVVM)
  go_router: ^14.0.0           # Navegación / rutas (ver docs/08-flujo-navegacion.md)
  drift: ^2.18.0               # ORM sobre SQLite local (offline-first)
  sqlite3_flutter_libs: ^0.5.0
  dio: ^5.4.0                  # Cliente HTTP para la API REST
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
